name: Billion Local AI CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/local-ai-engine

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Build PWA
        env:
          VITE_BASE_PATH: /Billion-accounting/
        run: npm run build

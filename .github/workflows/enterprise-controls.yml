name: Enterprise controls validation

on:
  push:
    branches:
      - feat/enterprise-controls-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Enterprise controls tests
        run: npm run test:controls
      - name: Build
        run: npm run build

name: Refresh live FX rates

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-live-fx
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch Tehran market rates from AlanChand
        env:
          ALANCHAND_TOKEN: ${{ secrets.ALANCHAND_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const token = process.env.ALANCHAND_TOKEN;
          if (!token) throw new Error('Missing ALANCHAND_TOKEN GitHub Actions secret. Add the free test token in repository Settings > Secrets and variables > Actions.');
          const specs = [
            { code: 'USD', key: 'usd', name: 'دلار آمریکا', symbol: '$' },
            { code: 'CNY', key: 'cny', name: 'یوان چین', symbol: '¥' },
            { code: 'AED', key: 'aed', name: 'درهم امارات', symbol: 'د.إ' },
            { code: 'EUR', key: 'eur', name: 'یورو اروپا', symbol: '€' }
          ];
          const number = value => {
            const n = Number(String(value ?? '').replace(/,/g, '').trim());
            return Number.isFinite(n) ? n : 0;
          };
          (async () => {
            const url = 'https://api.alanchand.com/?type=currencies&symbols=usd,cny,aed,eur';
            const response = await fetch(url, {
              headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' },
              signal: AbortSignal.timeout(20000)
            });
            const body = await response.text();
            if (!response.ok) throw new Error('AlanChand API HTTP ' + response.status + ': ' + body.slice(0, 500));
            const payload = JSON.parse(body);
            const items = specs.flatMap(spec => {
              const row = payload?.[spec.key];
              // AlanChand currency values are published in toman; the ERP stores IRR.
              const sellToman = number(row?.sell);
              if (!row || sellToman <= 0) return [];
              const changePercent = number(row.dayChange);
              return [{
                code: spec.code,
                name: spec.name,
                symbol: spec.symbol,
                priceIrr: Math.round(sellToman * 10),
                highIrr: Math.round(number(row.high) * 10) || undefined,
                lowIrr: Math.round(number(row.low) * 10) || undefined,
                changeIrr: 0,
                changePercent,
                direction: changePercent > 0 ? 'up' : changePercent < 0 ? 'down' : 'flat',
                updatedTime: String(row.updated_at || '')
              }];
            });
            if (items.length !== specs.length) {
              throw new Error('AlanChand returned incomplete currency data. Received: ' + items.map(x => x.code).join(', '));
            }
            fs.mkdirSync('public', { recursive: true });
            fs.writeFileSync('public/live-fx.json', JSON.stringify({
              fetchedAt: Date.now(),
              source: 'بازار آزاد تهران (الان‌چند)',
              sourceUrl: 'https://alanchand.com/',
              items
            }, null, 2) + '\n');
            console.log('Published AlanChand rates:', items.map(x => x.code + '=' + x.priceIrr).join(', '));
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Commit updated rates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh live FX rates from AlanChand"
          file_pattern: public/live-fx.json

name: Refresh live FX rates

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-live-fx
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch Tehran market rates from NerkhAra
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const specs = [
            { code: 'USD', key: 'usd', name: 'دلار آمریکا', symbol: '$' },
            { code: 'CNY', key: 'cny', name: 'یوان چین', symbol: '¥' },
            { code: 'AED', key: 'aed', name: 'درهم امارات', symbol: 'د.إ' },
            { code: 'EUR', key: 'eur', name: 'یورو اروپا', symbol: '€' }
          ];
          const number = value => {
            const n = Number(value);
            return Number.isFinite(n) ? n : 0;
          };
          (async () => {
            const response = await fetch('https://nerkhara.com/api/v1/latest.json', {
              headers: { Accept: 'application/json' },
              signal: AbortSignal.timeout(20000)
            });
            const body = await response.text();
            if (!response.ok) throw new Error('NerkhAra API HTTP ' + response.status + ': ' + body.slice(0, 500));
            const payload = JSON.parse(body);
            if (!Array.isArray(payload?.items)) throw new Error('NerkhAra response does not contain an items array.');
            const items = specs.flatMap(spec => {
              const row = payload.items.find(entry => entry?.id === spec.key);
              // NerkhAra currency prices are in IRT (toman); the ERP stores IRR.
              const priceToman = number(row?.price);
              if (!row || row.stale === true || priceToman <= 0) return [];
              const changePercent = number(row.change_pct);
              const updatedUtc = String(row.updated_utc || '');
              return [{
                code: spec.code,
                name: spec.name,
                symbol: spec.symbol,
                priceIrr: Math.round(priceToman * 10),
                highIrr: Math.round(number(row.high_24h) * 10) || undefined,
                lowIrr: Math.round(number(row.low_24h) * 10) || undefined,
                changeIrr: 0,
                changePercent,
                direction: changePercent > 0 ? 'up' : changePercent < 0 ? 'down' : 'flat',
                updatedTime: updatedUtc.includes('T') ? updatedUtc.slice(11, 16) : updatedUtc
              }];
            });
            if (items.length !== specs.length) {
              throw new Error('NerkhAra returned incomplete or stale currency data. Received: ' + items.map(x => x.code).join(', '));
            }
            const generated = Date.parse(String(payload.generated_utc || '') + 'Z');
            fs.mkdirSync('public', { recursive: true });
            fs.writeFileSync('public/live-fx.json', JSON.stringify({
              fetchedAt: Number.isFinite(generated) ? generated : Date.now(),
              source: 'بازار آزاد تهران (نرخ‌آرا)',
              sourceUrl: 'https://nerkhara.com/',
              items
            }, null, 2) + '\n');
            console.log('Published NerkhAra rates:', items.map(x => x.code + '=' + x.priceIrr).join(', '));
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Commit updated rates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh live FX rates from NerkhAra"
          file_pattern: public/live-fx.json
